<!DOCTYPE html>
<html lang="pt-br">
<head>
<title> Controles de formulários </title> 
<meta charset="UTF-8">
</head>

<body>
    <h1>Preferências</h1> 
    <form action="Cadastro.php" method="GET">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"> 
        <br>
        
        <p> Escolha um turno que deseja :</p>
        <input type="radio" name="turno" id="manha"> <label for="manha">Manhã</label>
        <br>
        <input type="radio" name="turno" id="tarde"> <label for="tarde">Tarde</label>
        <br>
        <input type="radio" name="turno" id="noite"> <label for="noite">Noite</label>
        <br>
       
        <p> Área tecnológica de interesse: </p>
        <input type="checkbox" name="area" id="programacao"><label for="programacao">programacao</label>
        <br>
        <input type="checkbox" name="area" id="design"> <label for="design">design</label>
        <br>
        <input type="checkbox" name="area" id="redes"> <label for="redes">redes</label> 
        <br>
        <input type="checkbox" name="area" id="banco de dados"> <label for="banco de dados">banco de dados</label> 
        <br>
        
        <p> Qual sua cor favorita? </p>
        <input type="color" name="Cor"> 
        
        
        <p> Seu nível de satisfação? </p>
        <input type="range" name="satisfeito"> 
        <p> Horário de sua preferência: </p>
        <input type="time" name=" horario">
        <br>
        <p> Envie um arquivo</p>
          <input type="arquiv" name="arquivo"> 
          <br>
        <input type="submit" value="cadastrar"> 
        <input type="reset" value="Limpar">
    </form>
</body>
