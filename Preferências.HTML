<!DOCTYPE html>
<html lang="pt-br">
<head>
<title> Controles de formulários </title> 
<meta charset="UTF-8">
</head>

<body>
    <h1>Preferências</h1> 
    <form action="Cadastro.php" method="GET">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"> 
        <br><br>
        
        <p> Qual turno você prefere estudar?</p>
        <br>
        <input type="radio" name="turno" id="manha"> <label for="manha">Manhã</label>
        <br>
        <input type="radio" name="turno" id="tarde"> <label for="tarde">Tarde</label>
        <br>
        <input type="radio" name="turno" id="noite"> <label for="noite">Noite</label>
        <br><br>
       
        <p>Quais áreas da tecnologia você tem interesse?</p>
        <input type="checkbox" name="area" id="programacao"><label for="programacao">programacao</label>
        <br>
        <input type="checkbox" name="area" id="design"> <label for="design">design</label>
        <br>
        <input type="checkbox" name="area" id="redes"> <label for="redes">redes</label> 
        <br>
        <input type="checkbox" name="area" id="bancodedados"> <label for="bancodedados">banco de dados</label> 
        <br>
        
        <label for="cor"> Qual sua cor favorita? </label>
        <input type="color" id="cor" name="Cor"> 
        <br><br>
        
        <label for="satisfeito"> Seu nível de satisfação? </label>
        <input type="range" id="satisfeito" name="satisfeito">
        <br><br>

        <label for="hora"> Horário de sua preferência: </label>
        <input type="time" id="hora" name=" horario">
        <br><br>

        <label for= "enviar"> Envie um arquivo</label>
          <input type="arquiv" id= "enviar" name="arquivo"> 
          <br><br>

        <input type="submit" value="cadastrar"> 
        <input type="reset" value="Limpar">
    </form>
</body>
